# Offline coexistence fixture; not a printer configuration.
[include bltouch.cfg]

[stepper_z]
position_min: -3

[load_cell bed_force]
sensor_type: hx711
sclk_pin: PA0
dout_pin: PA1
counts_per_gram: 100
reference_tare_counts: 1000

[auto_z_offset]
load_cell: bed_force
probe_points:
    28, 28
    110, 110
speed: 0.5
lift_speed: 0.1
trigger_force: 75
force_safety_limit: 200
