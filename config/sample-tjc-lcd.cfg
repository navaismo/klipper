# Complete stock Ender-3 V3 SE TJC LCD and knob integration.
# Copy into the active configuration directory and include once from
# printer.cfg. Do not also include sample-tjc-menu.cfg or duplicate sections.
# Requires this complete fork, Pillow in Klippy's environment, and MCU
# constants TJC_LCD_VERSION=1, TJC_JOB_VERSION=5, TJC_DRAW_VERSION=1.
# Keep the existing virtual_sdcard path, printer settings and pause macros.
# Host: USART1 PA9/PA10. LCD: USART2 PA2/PA3. Knob: PA11/PA12 and PB1.
# See docs/TJC_LCD_Setup.md and docs/Config_Reference.md.

[tjc_lcd]

[lcd_status]

[tjc_menu]
encoder_pins: ^PA11, ^PA12
click_pin: ^!PB1
