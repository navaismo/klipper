# Contact Regression (regression): estimate contact with LCBestFit.
# Keep [bltouch] and [load_cell bed_force] in printer.cfg.
# Enable only this include OR auto_z_offset_force_trigger.cfg.
# Section: [auto_z_offset_cr].
# Compatibility sample; prefer auto_z_offset_regression.cfg.

[auto_z_offset_cr]
load_cell: bed_force
probe_points:
    28, 28
    110, 110
offset_tolerance: 0.025
spatial_tolerance: 0.025
speed: 0.5
lift_speed: 0.1
sample_retract_dist: 0.5
trigger_force: 75
force_safety_limit: 200
bed_temp: 50
nozzle_temp: 170
temperature_tolerance: 3
temperature_stable_time: 2
temperature_recovery_time: 30
