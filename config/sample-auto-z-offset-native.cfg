# Force Trigger (force_trigger): use the MCU force-trigger Z; report only.
# Keep [bltouch] and [load_cell bed_force] in printer.cfg.
# Enable only this include OR auto_z_offset_regression.cfg.
# Section: [auto_z_offset_ft].
# Compatibility sample; prefer auto_z_offset_force_trigger.cfg.

[auto_z_offset_ft]
load_cell: bed_force
probe_points:
    28, 28
    110, 110
    180, 28
horizontal_move_z: 5
travel_speed: 50
speed: 0.5
lift_speed: 5
sample_retract_dist: 0.5
samples_tolerance: 0.025
trigger_force: 75
force_safety_limit: 200
bed_temp: 60
nozzle_temp: 170
temperature_tolerance: 3
