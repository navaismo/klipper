# Native pressure-reference calibration, report only.
# Keep the existing [bltouch] and [load_cell bed_force] in printer.cfg.
# Disable the complete [auto_z_offset] section / its include when selecting this.
# Do not add another [load_cell_probe] or duplicate the HX711 pins.

[auto_z_offset_native]
load_cell: bed_force
probe_points:
    28, 28
    110, 110
    180, 28
horizontal_move_z: 5
travel_speed: 50
speed: 0.5
lift_speed: 5
sample_retract_dist: 0.5
samples_tolerance: 0.025
trigger_force: 75
force_safety_limit: 200
bed_temp: 60
nozzle_temp: 170
temperature_tolerance: 3
