# Optional stock Ender-3 V3 SE knob menu for the mainboard TJC display.
# Requires [tjc_lcd] and firmware with TJC_DRAW_VERSION=1.
# Host communication must use USART1, not USB on PA11/PA12.
# Check the existing configuration for other uses of these pins.
# See docs/Config_Reference.md#tjc_menu for behavior and parameters.
# For all three LCD sections, use sample-tjc-lcd.cfg instead of this file.
# Do not include both samples; see docs/TJC_LCD_Setup.md.

[tjc_menu]
encoder_pins: ^PA11, ^PA12
click_pin: ^!PB1
